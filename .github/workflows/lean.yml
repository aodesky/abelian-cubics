name: Check Lean
on:
  push:
    branches: [main]
    paths: ['formalization/**', 'blueprint/paper-statements.tex', '.github/workflows/lean.yml']
  pull_request:
    paths: ['formalization/**', 'blueprint/paper-statements.tex', '.github/workflows/lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: formalization
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build, registry, and axiom checks
        working-directory: formalization
        run: python3 scripts/check.py
